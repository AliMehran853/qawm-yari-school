<!DOCTYPE html>
<html lang="fa-AF" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>آفلاین — مکتب قوم یاری</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #faf9f6;
        font-family: 'Vazirmatn', system-ui, Tahoma, sans-serif;
        padding: 20px;
      }
      .card {
        background: white;
        border-radius: 24px;
        padding: 40px 24px;
        max-width: 400px;
        width: 100%;
        text-align: center;
        box-shadow: 0 10px 25px -5px rgba(0,0,0,0.08);
        border: 1px solid #e5e7eb;
      }
      .icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        background: #eef2ff;
        color: #4338ca;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 36px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 8px;
        color: #111827;
      }
      p {
        color: #6b7280;
        margin: 0 0 24px;
        line-height: 1.7;
        font-size: 14px;
      }
      button {
        background: #4338ca;
        color: white;
        border: none;
        border-radius: 10px;
        padding: 12px 24px;
        font-size: 15px;
        font-family: inherit;
        cursor: pointer;
        font-weight: 500;
      }
      button:active { transform: scale(0.98); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">📡</div>
      <h1>اتصال اینترنت قطع است</h1>
      <p>
        صفحه‌هایی که قبلاً دیده‌اید آفلاین در دسترس هستند. برای دیدن اطلاعات
        جدید، لطفاً اینترنت خود را وصل کنید.
      </p>
      <button onclick="window.location.reload()">تلاش مجدد</button>
    </div>
  </body>
</html>
